name: PR - Quick Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quick-validation:
    name: Quick Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: TypeScript compilation
        run: npm run build
      
      - name: Run validation tests only
        run: npm test -- config/__tests__/types.test.ts config/validation/__tests__/config-checker.test.ts
        env:
          NODE_ENV: test
      
      - name: Comment PR with results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const comment = `## Quick Validation Results
            
            ✅ TypeScript compilation: Success
            ✅ Configuration validation tests: Passed
            
            Full test suite will run on merge to main.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
